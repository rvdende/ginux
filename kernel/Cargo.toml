[package]
name = "ginux-kernel"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = []
verification-boot = []
linux-boot-profile = []

[lib]
path = "src/lib.rs"

[dependencies]
ginux-credentials = { path = "../crates/credentials" }
ginux-keyrings = { path = "../crates/keyrings" }
ginux-landlock = { path = "../crates/landlock" }
ginux-rtnetlink = { path = "../crates/rtnetlink" }
ginux-udplite = { path = "../crates/udplite" }
ginux-tty = { path = "../crates/tty" }
ginux-image-store = { path = "../crates/image-store" }
ginux-memory-areas = { path = "../crates/memory-areas" }
ginux-deadline-heap = { path = "../crates/deadline-heap" }
ginux-cgroup = { path = "../crates/cgroup" }
ginux-ext2 = { path = "../crates/ext2" }
ginux-seccomp = { path = "../crates/seccomp" }
ginux-oci = { path = "../crates/oci" }
ginux-oci-cache = { path = "../crates/oci-cache" }
ed25519-dalek = { version = "=3.0.0", default-features = false }
font8x8 = { version = "=0.3.1", default-features = false }
ginux-native-abi = { path = "../crates/native-abi" }
ginux-usb-audio = { path = "../crates/usb-audio" }
ginux-usb-hid = { path = "../crates/usb-hid" }
ginux-virtio-gpu = { path = "../crates/virtio-gpu" }
ginux-drm = { path = "../crates/drm" }
ginux-volume-format = { path = "../crates/volume-format" }
ginux-volume-service = { path = "../crates/volume-service" }
miniz_oxide = { version = "=0.9.1", default-features = false }
smoltcp = { version = "=0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-udp", "socket-tcp", "socket-raw", "auto-icmp-echo-reply", "iface-max-addr-count-3"] }
