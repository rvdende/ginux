# Multi-CPU tests: boot Ginux under QEMU with several CPUs and check that a
# domain given more than one CPU runs its processes on all of them.
#
#   make build && cargo test --manifest-path tests/smp/Cargo.toml multicore
#
# (`make test-multicore` does both.) Its own workspace, like tests/ltp.
[package]
name = "ginux-smp-tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[[test]]
name = "multicore"
